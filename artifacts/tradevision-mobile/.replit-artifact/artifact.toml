kind = "mobile"
previewPath = "/mobile/"
title = "TradeVision AI Pro Mobile"
version = "1.0.0"
id = "artifacts/tradevision-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20927

[services.development]
run = "pnpm --filter @workspace/tradevision-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tradevision-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/tradevision-mobile", "run", "serve" ]

[services.env]
PORT = "20927"
BASE_PATH = "/mobile/"
