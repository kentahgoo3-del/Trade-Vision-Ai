name: Build Android APK

# Trigger manually from GitHub → Actions tab, or automatically on every push to main
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android-apk:
    name: Build APK (EAS local)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node + pnpm (exact version that generated the lockfile) ────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm 10.26.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      # ── 3. Install workspace dependencies from the monorepo root ─────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. Java 17 (required by Gradle / Android build) ──────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. EAS CLI + authenticate with your Expo account ─────────────────────
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── 6. Build the APK locally (no EAS cloud, no pnpm re-install) ──────────
      - name: Build APK
        working-directory: artifacts/tradevision-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output ${{ github.workspace }}/TradeVision-AI.apk

      # ── 7. Upload APK so you can download it from the Actions run page ────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeVision-AI-APK
          path: TradeVision-AI.apk
          retention-days: 30
